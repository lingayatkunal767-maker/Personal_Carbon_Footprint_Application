<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌿</text></svg>" />
    
    <!-- Primary Mobile Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EcoTracker" />
    
    <!-- Theme & Color -->
    <meta name="theme-color" content="#2e7d32" />
    <meta name="msapplication-navbutton-color" content="#2e7d32" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- SEO & Description -->
    <meta name="description" content="Personal Footprint - Track, reduce, and sustain your carbon emissions" />
    <meta name="keywords" content="carbon footprint, sustainability, eco tracker, emissions" />
    
    <!-- Prevent Auto-Zoom on Input Focus (iOS) -->
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    
    <title>Personal Footprint - Sustainability Tracker</title>
    
    <style>
      /* Prevent flash of unstyled content */
      #root {
        opacity: 0;
        animation: fadeIn 0.3s ease-in forwards;
      }
      
      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }
      
      /* Loading indicator */
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
