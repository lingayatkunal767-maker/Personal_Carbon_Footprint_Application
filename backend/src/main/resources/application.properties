spring.application.name=carbontracker

# Load OAuth/mail secrets from local file (not in repo). Put application-local.properties next to pom.xml or in project root.
spring.config.import=optional:file:./application-local.properties

# Database Configuration (now using PostgreSQL instead of in-memory H2)
spring.datasource.url=jdbc:postgresql://localhost:5432/carbon_tracker
spring.datasource.username=postgres
spring.datasource.password=Anuj@1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# OAuth2 Login - optional. App starts without them; set via env or application-local.properties to enable.
# Placeholder "optional" allows startup; replace with real credentials to use Sign in with Google/GitHub.

# Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:optional}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:optional}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:optional}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:optional}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:8080/login/oauth2/code/github

# Frontend redirect URI after successful OAuth2 login
app.oauth2.authorizedRedirectUri=http://localhost:3000/oauth2/redirect

# Mail (OTP for forgot password) - set in application-local.properties to send OTP by email
# When not set, OTP is returned in API response for dev. Set app.mail.enabled=true and SMTP details to send email.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${spring.mail.username:}}
app.mail.enabled=${MAIL_ENABLED:false}
