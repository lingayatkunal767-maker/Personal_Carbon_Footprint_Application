# ========================================
# Sustainability Tracker - Spring Boot App
# ========================================

# Server Port (matches frontend API_BASE_URL)
server.port=8080

# ========================================
# PostgreSQL DataSource Configuration
# ========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/sustainability_tracker
spring.datasource.username=tracker_user
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ========================================
# JPA / Hibernate Configuration
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Use 'validate' since schema already exists via schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# CORS - Allow React Dev Server
# ========================================
app.cors.allowed-origins=http://localhost:5173

# ========================================
# Logging
# ========================================
logging.level.com.sustainability=DEBUG
logging.level.org.springframework.web=INFO
