# ========================================
# Sustainability Tracker - Spring Boot App
# ========================================

# Server Port (8081 because Oracle TNS occupies 8080)
server.port=8081

# ========================================
# PostgreSQL DataSource Configuration
# ========================================
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/sustainability_tracker
spring.datasource.username=tracker_user
spring.datasource.password=tracker123
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ========================================
# JPA / Hibernate Configuration
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Use 'validate' since schema already exists via schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# CORS - Allow React Dev Server
# ========================================
app.cors.allowed-origins=http://localhost:5173

# ========================================
# Logging
# ========================================
logging.level.com.sustainability=DEBUG
logging.level.org.springframework.web=INFO

# ========================================
# Carbon Emission Factors
# ========================================
# Transport (kg CO2e/km)
carbon.emission.factor.transport.car=0.192
carbon.emission.factor.transport.bus=0.105
carbon.emission.factor.transport.train=0.041
carbon.emission.factor.transport.auto=0.120
carbon.emission.factor.transport.ev_car=0.060

# Food (kg CO2e/meal)
carbon.emission.factor.food.non_veg=2.5
carbon.emission.factor.food.veg=1.2

# Energy
carbon.emission.factor.energy.electricity=0.82
carbon.emission.factor.energy.lpg_cylinder=42.6
# 14.2 kg * 3.0 kg CO2e/kg = 42.6 kg CO2e per cylinder
