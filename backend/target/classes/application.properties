# ========================================
# Sustainability Tracker - Spring Boot App
# ========================================

# Optional local environment files (supports both .env and .ENV naming)
spring.config.import=optional:file:.env[.properties],optional:file:.ENV[.properties]

# Server Port (8081 because Oracle TNS occupies 8080)
server.port=${SERVER_PORT:8081}

# ========================================
# DataSource Configuration
# PostgreSQL-first defaults loaded from env vars.
# You can still override everything using SPRING_DATASOURCE_*.
# ========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sustainability_tracker}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ========================================
# JPA / Hibernate Configuration
# ========================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# ========================================
# CORS - Allow React Dev Server
# ========================================
app.cors.allowed-origins=http://localhost:5173
cors.allowed.origins=http://localhost:5173

# ========================================
# Logging
# ========================================
logging.level.com.sustainability=DEBUG
logging.level.org.springframework.web=INFO

# ========================================
# Carbon Emission Factors
# ========================================
# Transport (kg CO2e/km)
carbon.emission.factor.transport.car=0.192
carbon.emission.factor.transport.bus=0.105
carbon.emission.factor.transport.train=0.041
carbon.emission.factor.transport.auto=0.120
carbon.emission.factor.transport.ev_car=0.060
carbon.emission.factor.transport.bike=0.0
carbon.emission.factor.transport.walk=0.0
carbon.emission.factor.transport.metro=0.041

# Food (kg CO2e/meal)
carbon.emission.factor.food.non_veg=2.5
carbon.emission.factor.food.veg=1.2

# Energy (kg CO2e per unit)
carbon.emission.factor.energy.electricity=0.82
carbon.emission.factor.energy.lpg_cylinder=42.6
# 14.2 kg LPG * 3.0 kg CO2e/kg = 42.6 kg CO2e per cylinder

# Behavior dataset configuration
carbon.behavior.dataset.path=${CARBON_BEHAVIOR_DATASET_PATH:data/personal_carbon_footprint_behavior.csv}
carbon.behavior.blend-weight=${CARBON_BEHAVIOR_BLEND_WEIGHT:0.30}
